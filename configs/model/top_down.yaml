defaults:
  - species_encoder: evopf
  - /data/collate_fn@_global_.data.collate_fn: top_down
  - /data/map_fn@_global_.data.map_fn: dgl
  - _self_

# Top down: covariance-readout head (TopDownCovAttention).
_target_: src.top_down.TopDownDiffusionModel
# Settled width-128 default (h=128 / n_layers=12 / n_heads=8 / species n_blocks=0).
lr: 0.01
weight_decay: ${weight_decay}
ema_decay: ${ema_decay}
warmup_steps: ${warmup_steps}
mup_mha_fix: ${mup_mha_fix}
mup_optimizer: ${mup_optimizer}
alpha: 2
# PDA log-prior bias on the logits (the settled default; override model.offset to
# the dataset tree prior with offset='${data.dataset_cfg.cfg.tree.name}').
offset: pda
rb: ${rb}
# Settled default: no EvoPF blocks in the species encoder — leaf features come
# straight from the MSA embedding (Linear→128), and all cross-species/position
# mixing happens in the SPD-attn trunk below. Override model.species_encoder.n_blocks
# to re-enable EvoPF blocks.
species_encoder:
  n_blocks: 0
rate_predictor:
  _target_: src.top_down.TopDownCovAttention
  h_size: 128 #512
  n_layers: 12
  n_heads: 8 #16
  max_spd: 250 #100
  unpooled: true
  pair_dim: 256
  pair_inner_dim: 32
  use_layernorm: ${use_layernorm}
  depth_mup: ${depth_mup}
  # Covariance-head knobs:
  # cov_layernorm: affine-normalize c(X,N) before the readout MLP (off → keep
  #   the covariance magnitude as signal).
  # empty_sibling_init: initial scale on −c(X, sibling) for empty children; 1.0
  #   reproduces "negate the sibling, add an empty vector".
  cov_layernorm: false
  empty_sibling_init: 1.0
  # use_cov_attention: full ("quartic") self-attention over every (species, node)
  #   cell of the covariance grid as its own token (EvoPF PairAttention, symmetric)
  #   before readout, with empty child slots added as columns.
  # cov_attn_layers: depth of that stack.
  use_cov_attention: true
  cov_attn_layers: 2
  # use_second_basis: keep obs_basis channel 1 (squaretrick / unrooted). Set false
  #   to ablate it (rooted channel only) for the node seed + refresh.
  use_second_basis: true
  # Trunk ablation flags (reuse the global toggles; rope/spd intentionally left on).
  use_pair: ${use_pair}
  use_refresh: ${use_refresh}
  use_hamming: ${use_hamming}
  use_cls: ${use_cls}
  # use_spd: SPD shortest-path attention bias inside the trunk.
  # use_node_seed: seed internal nodes from the basis-averaged subtree leaf
  #   features (off → nodes start at zero, topology only via struct seed + refresh).
  use_spd: ${use_spd}
  use_node_seed: ${use_node_seed}
